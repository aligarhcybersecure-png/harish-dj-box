<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harish DJ Box - Aligarh</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#111;color:#fff;margin:0;padding-bottom:90px}
header{background:red;padding:15px;text-align:center}
header h1{margin:0;font-size:28px}
.top-btns button{padding:10px 18px;border:none;border-radius:8px;font-weight:bold;background:#fff;font-size:16px}
.card{background:#222;border-radius:12px;padding:12px;text-align:center;margin:12px}
.card img{width:100%;height:200px;object-fit:cover;border-radius:8px;background:#333}
.price{color:#0f0;font-weight:bold;font-size:22px}
.card button{width:100%;padding:13px;margin-top:7px;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}
.addBtn{background:#25D366;color:#fff}
.waDirect{background:#fff;color:#000}
#cartBar{position:fixed;bottom:0;left:0;right:0;background:#fff;color:#000;padding:12px;display:flex;justify-content:space-between;align-items:center}
#cartBar button{background:red;color:#fff;border:none;padding:12px 18px;border-radius:8px;font-weight:bold}
.popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);padding:15px;overflow:auto;z-index:100}
.modalBox{background:#fff;color:#000;border-radius:12px;padding:15px;max-width:500px;margin:auto}
.modalBox input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
.modalBox button{width:100%;padding:13px;margin-top:8px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.payBtn{background:#5f259f;color:#fff}
.waBtn{background:#25D366;color:#fff}
.closeBtn{background:#ddd}
</style>
</head>
<body>
<header><h1>🔊 HARISH DJ BOX 🔊</h1><p>Aligarh | Best Sound - Best Price | 📞 9368638452</p><div class="top-btns"><button onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</button></div></header>
<div id="products"><p style="text-align:center">Loading...</p></div>
<div id="cartBar"><div><b id="cartTotalText">Cart: 0 Item - ₹0</b></div><button onclick="openCart()">Cart Dekhein →</button></div>
<div id="cartModal" class="popup"><div class="modalBox"><h2>🛒 Tumhara Cart</h2><div id="cartItems"></div><h3 id="cartTotal">Total: ₹0</h3><input id="custName" placeholder="Apna Naam"><input id="custAddr" placeholder="Address - Aligarh"><p>UPI: 9368638452@ptaxis</p><button class="payBtn" onclick="payNow()">💳 UPI Se Payment Karein</button><button class="waBtn" onclick="orderWhatsApp()">📲 WhatsApp Par Order Bhejo</button><button class="closeBtn" onclick="closeCart()">Band Karein</button></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://PASTE_YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "PASTE_YOUR_PROJECT",
  storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
let products = [];
let cart = [];
const defaultProducts = [
{name:"12 Inch Single DJ Box", price:4999, desc:"Home Party ke liye best - Aligarh", img:"https://picsum.photos/600/400?random=11"},
{name:"15 Inch Double DJ Box", price:11999, desc:"Shadi / DJ Night ke liye - Aligarh", img:"https://picsum.photos/600/400?random=22"},
{name:"Full DJ Setup Rent", price:2999, desc:"2 Box + Light + DJ - Per Night Aligarh", img:"https://picsum.photos/600/400?random=33"}
];
function render(){
let h=""; if(products.length==0) products=defaultProducts;
products.forEach((p,i)=>{ h+=`<div class="card"><img src="${p.img}"><h3>${p.name}</h3><p>${p.desc}</p><div class="price">₹${p.price}</div><button class="addBtn" onclick="addToCart(${i})">🛒 Cart Me Dalein</button><button class="waDirect" onclick="buyNow(${i})">📲 Abhi Order Karein</button></div>`; });
document.getElementById('products').innerHTML=h;
}
onValue(ref(db,'products'), (snap)=>{ if(snap.exists()){ products = Object.values(snap.val()); } else { products = defaultProducts; } render(); });
window.addToCart = function(i){ let p=products[i]; let f=cart.find(x=>x.name===p.name); if(f) f.qty++; else cart.push({name:p.name, price:p.price, qty:1}); updateBar(); alert(p.name+" Cart me add ho gaya!"); }
window.buyNow = function(i){ let p=products[i]; window.open("https://wa.me/919368638452?text=Namaste Harish Bhai! Mujhe Order Karna Hai%0A%0A"+encodeURIComponent(p.name)+" - ₹"+p.price+"%0AAddress: Aligarh",'_blank'); }
window.openCart = function(){ let b=document.getElementById('cartItems'); let t=0, h=""; if(cart.length==0) h="<p>Cart Khali Hai</p>"; cart.forEach((c,i)=>{ t+=c.price*c.qty; h+=`<p><b>${c.name}</b><br>₹${c.price} x ${c.qty} = ₹${c.price*c.qty} <button onclick="removeItem(${i})" style="width:auto;padding:5px 10px">❌</button></p><hr>`; }); b.innerHTML=h; document.getElementById('cartTotal').innerText="Total: ₹"+t; document.getElementById('cartModal').style.display='block'; }
window.removeItem = function(i){ cart.splice(i,1); updateBar(); openCart(); }
window.closeCart = function(){ document.getElementById('cartModal').style.display='none'; }
window.payNow = function(){ let t=0; cart.forEach(c=>t+=c.price*c.qty); if(t==0){alert("Pehle Cart me kuch dalo");return;} window.location.href="upi://pay?pa=9368638452@ptaxis&pn=Harish DJ Box&am="+t+"&cu=INR&tn=Order"; }
window.orderWhatsApp = function(){ let n=document.getElementById('custName').value||"Customer"; let a=document.getElementById('custAddr').value||"Aligarh"; let m="Namaste Harish Bhai! Mujhe Order Karna Hai%0A%0AName: "+n+"%0AAddress: "+a+" - Aligarh%0A%0A"; let t=0; cart.forEach(c=>{ m+=c.name+" - ₹"+c.price+" x "+c.qty+" = ₹"+(c.price*c.qty)+"%0A"; t+=c.price*c.qty; }); m+="%0ATotal: ₹"+t; window.open("https://wa.me/919368638452?text="+m,'_blank'); }
function updateBar(){ let t=0,c=0; cart.forEach(x=>{t+=x.price*x.qty;c+=x.qty;}); document.getElementById('cartCount').innerText=c; document.getElementById('cartTotalText').innerText="Cart: "+c+" Item - ₹"+t; }
</script>
</body>
</html>
